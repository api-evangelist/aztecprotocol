description: Aztecprotocol is a privacy‑first, zero‑knowledge rollup (zkRollup) built on Ethereum that enables confidential transactions and private
  smart contracts. It provides a decentralized, privacy‑preserving Layer 2 solution, offering developers tools, SDKs, and documentation to build
  secure, scalable applications while keeping transaction data hidden from public view.

